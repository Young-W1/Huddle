services:
  # Backend API
  - type: web
    name: huddle-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://huddle-frontend.onrender.com
      - key: RATE_LIMIT_RPM
        value: "100"
      - key: RATE_LIMIT_RPH
        value: "2000"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: DEV_MODE
        value: "false"

  # Frontend React App
  - type: web
    name: huddle-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/build
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://huddle-api.onrender.com
      - key: NODE_VERSION
        value: 18

databases:
  - name: huddle-db
    databaseName: huddle
    user: huddle_user
    plan: free
