# Server
server.port=${PORT:8080}

# Error handling - hide stack traces from users
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Database - Render provides DATABASE_URL in postgres:// format
# Option 1: Use individual vars (recommended)
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - Optimized for Render free tier
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT (use the same secret from your local config)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration for production
cors.allowed-origins=${CORS_ORIGINS:https://huddle-frontend-waul.onrender.com}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true

# Pagination Configuration
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${UPLOAD_DIR:/opt/render/project/uploads}

# Actuator - for health checks (optimized for slow DB connections)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=false
management.health.mail.enabled=false
management.prometheus.metrics.export.enabled=true

# Logging - reduce verbosity in production
logging.level.root=WARN
logging.level.com.capstone.huddle=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Rate Limiting Configuration
rate.limit.requests-per-minute=${RATE_LIMIT_RPM:100}
rate.limit.requests-per-hour=${RATE_LIMIT_RPH:2000}

# API Documentation
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# Cache Configuration
spring.cache.type=simple

# Application Mode
app.dev-mode=${DEV_MODE:false}
app.base-url=${APP_BASE_URL:https://huddle-frontend.onrender.com}
app.password-reset.token-expiry-hours=24

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from-address=${MAIL_FROM:noreply@huddle.com}
app.mail.from-name=${MAIL_FROM_NAME:Huddle}

# Admin Configuration
app.admin.email=${ADMIN_EMAIL:youngwynn234@gmail.com}
