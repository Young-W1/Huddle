# Server
server.port=${PORT:8080}

# Error handling - hide stack traces from users
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Database - Render provides DATABASE_URL in jdbc format
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/huddle}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (use the same secret from your local config)
jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyThatIsAtLeast512BitsLongForHS512AlgorithmSecurityRequirements}
jwt.expiration=86400000

# Actuator - for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging - reduce verbosity in production
logging.level.root=WARN
logging.level.com.capstone.huddle=INFO
logging.level.org.springframework.security=WARN

