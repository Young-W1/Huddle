spring.application.name=Huddle

# ================================
# Server Configuration
# ================================
server.port=6061
server.servlet.context-path=
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ================================
# Database Configuration
# ================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/huddle}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ================================
# Security Configuration
# ================================
jwt.secret=${JWT_SECRET:your-512-bit-secret-key-for-production-must-be-at-least-64-characters-long-for-HS512-algorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ================================
# Pagination Configuration
# ================================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size
spring.data.web.sort.sort-parameter=sort

# ================================
# File Upload Configuration
# ================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${UPLOAD_DIR:uploads}

# ================================
# Actuator & Observability Configuration
# ================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Prometheus metrics endpoint
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# ================================
# Logging Configuration
# ================================
logging.level.root=INFO
logging.level.com.capstone.huddle=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ================================
# API Documentation Configuration
# ================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true

# ================================
# Rate Limiting Configuration
# ================================
rate.limit.requests-per-minute=${RATE_LIMIT_RPM:60}
rate.limit.requests-per-hour=${RATE_LIMIT_RPH:1000}

# ================================
# Cache Configuration
# ================================
spring.cache.type=simple

# ================================
# Application Mode Configuration
# ================================
# Set to false in production to send actual emails
# Set to true to just log emails without sending (for testing)
app.dev-mode=${DEV_MODE:false}
app.base-url=${APP_BASE_URL:http://localhost:3000}
app.password-reset.token-expiry-hours=24

# ================================
# Email Configuration (Gmail Example)
# ================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:youngwynn234@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ccjgfplpfuyearow}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender info
app.mail.from-address=${MAIL_FROM:youngwynn234@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Huddle}

