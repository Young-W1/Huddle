<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Profile</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <img src="https://via.placeholder.com/150" class="rounded-circle mb-3" alt="Profile">
                        <h4 id="profileName"></h4>
                        <p class="text-muted" id="profileBio"></p>
                        <div class="d-flex justify-content-around mb-3">
                            <div>
                                <h5 id="articleCount">0</h5>
                                <small class="text-muted">Articles</small>
                            </div>
                            <div>
                                <h5 id="followersCount">0</h5>
                                <small class="text-muted">Followers</small>
                            </div>
                            <div>
                                <h5 id="followingCount">0</h5>
                                <small class="text-muted">Following</small>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-sm" id="editProfileBtn" style="display:none;"
                                data-bs-toggle="modal" data-bs-target="#editProfileModal">
                            Edit Profile
                        </button>
                        <button class="btn btn-primary btn-sm" id="followBtn" style="display:none;">
                            Follow
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <nav>
                    <div class="nav nav-tabs" id="nav-tab">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#articles">
                            Articles
                        </button>
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#followers">
                            Followers
                        </button>
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#following">
                            Following
                        </button>
                    </div>
                </nav>
                <div class="tab-content mt-4">
                    <div class="tab-pane fade show active" id="articles">
                        <div id="userArticles">
                            <!-- Articles will be loaded here -->
                        </div>
                    </div>
                    <div class="tab-pane fade" id="followers">
                        <div id="followersList">
                            <!-- Followers will be loaded here -->
                        </div>
                    </div>
                    <div class="tab-pane fade" id="following">
                        <div id="followingList">
                            <!-- Following will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editProfileForm">
                        <div class="mb-3">
                            <label for="editBio" class="form-label">Bio</label>
                            <textarea class="form-control" id="editBio" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateProfile()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script th:inline="javascript">
        const userId = window.location.pathname.includes('profile') && !window.location.pathname.includes('users')
            ? 'current'
            : window.location.pathname.split('/').pop();
        let isOwnProfile = false;

        function loadProfile() {
            const url = userId === 'current'
                ? '/huddle/users/profile'
                : `/huddle/users/${userId}/profile`;

            $.ajax({
                url: url,
                type: 'GET',
                headers: userId === 'current' ? {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                } : {},
                success: function(profile) {
                    $('#profileName').text(profile.username);
                    $('#profileBio').text(profile.bio || 'No bio yet');
                    $('#articleCount').text(profile.articleCount || 0);
                    $('#followersCount').text(profile.followersCount || 0);
                    $('#followingCount').text(profile.followingCount || 0);

                    // Show edit button for own profile
                    if (userId === 'current' || profile.isOwnProfile) {
                        $('#editProfileBtn').show();
                        isOwnProfile = true;
                    } else if (localStorage.getItem('token')) {
                        $('#followBtn').show();
                    }

                    loadUserContent();
                }
            });
        }

        function loadUserContent() {
            // Load user articles
            $.get(`/huddle/articles/user/${userId}`, function(articles) {
                const container = $('#userArticles');
                container.empty();

                articles.forEach(article => {
                    const card = `
                        <div class="card mb-3">
                            <div class="card-body">
                                <h5><a href="/articles/${article.id}">${article.title}</a></h5>
                                <p class="text-muted">${article.content.substring(0, 150)}...</p>
                                <small class="text-muted">${new Date(article.createdAt).toLocaleDateString()}</small>
                            </div>
                        </div>
                    `;
                    container.append(card);
                });
            });

            // Load followers
            $.get(`/huddle/users/${userId}/followers`, function(followers) {
                const container = $('#followersList');
                container.empty();

                followers.forEach(follower => {
                    const item = `
                        <div class="d-flex align-items-center mb-3">
                            <img src="https://via.placeholder.com/40" class="rounded-circle me-3">
                            <div>
                                <h6 class="mb-0">${follower.username}</h6>
                                <small class="text-muted">${follower.bio || ''}</small>
                            </div>
                        </div>
                    `;
                    container.append(item);
                });
            });

            // Load following
            $.get(`/huddle/users/${userId}/following`, function(following) {
                const container = $('#followingList');
                container.empty();

                following.forEach(user => {
                    const item = `
                        <div class="d-flex align-items-center mb-3">
                            <img src="https://via.placeholder.com/40" class="rounded-circle me-3">
                            <div>
                                <h6 class="mb-0">${user.username}</h6>
                                <small class="text-muted">${user.bio || ''}</small>
                            </div>
                        </div>
                    `;
                    container.append(item);
                });
            });
        }

        function updateProfile() {
            const profileData = {
                bio: $('#editBio').val()
            };

            $.ajax({
                url: '/huddle/users/profile',
                type: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token'),
                    'Content-Type': 'application/json'
                },
                data: JSON.stringify(profileData),
                success: function() {
                    $('#editProfileModal').modal('hide');
                    loadProfile();
                }
            });
        }

        $('#followBtn').on('click', function() {
            $.ajax({
                url: `/huddle/users/${userId}/follow`,
                type: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                success: function() {
                    $(this).text('Unfollow');
                    loadProfile();
                }
            });
        });

        $(document).ready(function() {
            loadProfile();
        });
    </script>
</div>
</body>
</html>
