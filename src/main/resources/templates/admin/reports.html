<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Report Management</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-5">
        <h1 class="mb-4">Report Management</h1>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Article</th>
                            <th>Reporter</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="reportsTable">
                        <!-- Reports will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script th:inline="javascript">
        function loadReports() {
            $.ajax({
                url: '/huddle/reports/all-reports',
                type: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                success: function(response) {
                    const tbody = $('#reportsTable');
                    tbody.empty();

                    if (response.data && response.data.length > 0) {
                        response.data.forEach(report => {
                            const row = `
                                <tr>
                                    <td>${report.id}</td>
                                    <td><a href="/articles/${report.articleId}">${report.articleTitle}</a></td>
                                    <td>${report.reporterName}</td>
                                    <td>${report.reason}</td>
                                    <td>
                                        <span class="badge bg-${getStatusColor(report.status)}">
                                            ${report.status}
                                        </span>
                                    </td>
                                    <td>${new Date(report.createdAt).toLocaleDateString()}</td>
                                    <td>
                                        <button class="btn btn-sm btn-success" onclick="updateStatus(${report.id}, 'RESOLVED')">
                                            Resolve
                                        </button>
                                        <button class="btn btn-sm btn-danger" onclick="updateStatus(${report.id}, 'DISMISSED')">
                                            Dismiss
                                        </button>
                                    </td>
                                </tr>
                            `;
                            tbody.append(row);
                        });
                    }
                }
            });
        }

        function getStatusColor(status) {
            switch(status) {
                case 'PENDING': return 'warning';
                case 'RESOLVED': return 'success';
                case 'DISMISSED': return 'secondary';
                default: return 'primary';
            }
        }

        function updateStatus(reportId, status) {
            $.ajax({
                url: `/huddle/reports/${reportId}`,
                type: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token'),
                    'Content-Type': 'application/json'
                },
                data: JSON.stringify({ status: status }),
                success: function() {
                    loadReports();
                }
            });
        }

        $(document).ready(function() {
            loadReports();
        });
    </script>
</div>
</body>
</html>
