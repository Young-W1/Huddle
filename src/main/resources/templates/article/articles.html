<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/base}">
<head>
    <title>Articles</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-5">
        <div class="row">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 th:text="${showUserArticles != null and showUserArticles} ? 'My Articles' : 'Latest Articles'">Latest Articles</h1>
                    <a sec:authorize="isAuthenticated()" th:href="@{/articles/create}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Write Article
                    </a>
                </div>

                <!-- Toggle between all articles and my articles -->
                <div class="btn-group mb-4" role="group" sec:authorize="isAuthenticated()">
                    <a th:href="@{/articles}"
                       class="btn"
                       th:classappend="${showUserArticles == null or !showUserArticles} ? 'btn-primary' : 'btn-outline-primary'">
                        All Articles
                    </a>
                    <a th:href="@{/my-articles}"
                       class="btn"
                       th:classappend="${showUserArticles != null and showUserArticles} ? 'btn-primary' : 'btn-outline-primary'">
                        My Articles
                    </a>
                </div>

                <div id="articlesList">
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
                <nav>
                    <ul class="pagination" id="pagination"></ul>
                </nav>
            </div>
            <div class="col-lg-4">
                <!-- Search -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Search Articles</h5>
                        <form id="searchForm">
                            <div class="input-group">
                                <input type="text" class="form-control" id="searchQuery" placeholder="Search...">
                                <button class="btn btn-primary" type="submit">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Categories -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Categories</h5>
                        <div class="list-group list-group-flush">
                            <a href="#" class="list-group-item list-group-item-action" data-category="Technology">Technology</a>
                            <a href="#" class="list-group-item list-group-item-action" data-category="Science">Science</a>
                            <a href="#" class="list-group-item list-group-item-action" data-category="Business">Business</a>
                            <a href="#" class="list-group-item list-group-item-action" data-category="Health">Health</a>
                            <a href="#" class="list-group-item list-group-item-action" data-category="Travel">Travel</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script th:inline="javascript">
        const showUserArticles = [[${showUserArticles}]] || false;
        let currentPage = 0;
        const pageSize = 10;

        function loadArticles(page = 0, query = '') {
            let url;
            let headers = {};

            if (showUserArticles) {
                // Use session-based endpoint for user's articles
                url = `/huddle/articles/my-articles-session?page=${page}&size=${pageSize}`;
            } else if (query) {
                url = `/huddle/articles/search?q=${query}&page=${page}&size=${pageSize}`;
            } else {
                url = `/huddle/articles/allArticles?page=${page}&size=${pageSize}`;
            }

            // Add JWT token if it exists (for API users)
            const token = localStorage.getItem('token');
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }

            $.ajax({
                url: url,
                type: 'GET',
                headers: headers,
                success: function(response) {
                    console.log('Articles response:', response);

                    // Handle the wrapped response structure
                    const data = response.data || response;
                    const container = $('#articlesList');
                    container.empty();

                    if (data && data.content && data.content.length > 0) {
                        data.content.forEach(article => {
                            const isOwner = showUserArticles;
                            const articleHtml = `
                            <article class="card mb-4">
                                <div class="card-body">
                                    <h2 class="card-title h4">
                                        <a href="/articles/${article.id}" class="text-decoration-none">
                                            ${article.title}
                                        </a>
                                    </h2>
                                    <div class="text-muted mb-3">
                                        <small>
                                            <i class="bi bi-person"></i> ${article.authorName || article.authorUsername || 'Anonymous'}
                                            <i class="bi bi-calendar ms-3"></i> ${new Date(article.createdAt).toLocaleDateString()}
                                            <i class="bi bi-eye ms-3"></i> ${article.views || 0} views
                                            <i class="bi bi-star ms-3"></i> ${(article.averageRating || 0).toFixed(1)}
                                        </small>
                                    </div>
                                    <p class="card-text">${article.content.substring(0, 200)}...</p>
                                    <div class="d-flex gap-2">
                                        <a href="/articles/${article.id}" class="btn btn-sm btn-outline-primary">Read More</a>
                                        ${isOwner ? `
                                            <a href="/articles/edit/${article.id}" class="btn btn-sm btn-outline-secondary">
                                                <i class="bi bi-pencil"></i> Edit
                                            </a>
                                            <button onclick="deleteArticle('${article.id}')" class="btn btn-sm btn-outline-danger">
                                                <i class="bi bi-trash"></i> Delete
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            </article>
                        `;
                            container.append(articleHtml);
                        });

                        updatePagination(data.totalPages, page);
                    } else {
                        container.html(`
                        <div class="text-center py-5">
                            <p class="text-muted">${showUserArticles ?
                            'You haven\'t written any articles yet.' :
                            'No articles found.'}</p>
                            ${showUserArticles ?
                            '<a href="/articles/create" class="btn btn-primary mt-3">Write Your First Article</a>' :
                            ''}
                        </div>
                    `);
                    }
                },
                error: function(xhr) {
                    console.error('Failed to load articles:', xhr);
                    if (xhr.status === 401 && showUserArticles) {
                        window.location.href = '/login';
                    } else {
                        $('#articlesList').html('<p class="text-center text-danger">Failed to load articles. Please try again.</p>');
                    }
                }
            });
        }

        function deleteArticle(articleId) {
            if (confirm('Are you sure you want to delete this article?')) {
                $.ajax({
                    url: `/huddle/articles/delete/${articleId}`,
                    type: 'DELETE',
                    success: function() {
                        loadArticles(currentPage);
                    },
                    error: function() {
                        alert('Failed to delete article');
                    }
                });
            }
        }

        function updatePagination(totalPages, currentPageNum) {
            currentPage = currentPageNum;
            const pagination = $('#pagination');
            pagination.empty();

            if (totalPages <= 1) return;

            for (let i = 0; i < totalPages; i++) {
                const pageItem = $('<li class="page-item"></li>');
                if (i === currentPage) pageItem.addClass('active');

                const pageLink = $(`<a class="page-link" href="#">${i + 1}</a>`);
                pageLink.on('click', function(e) {
                    e.preventDefault();
                    loadArticles(i);
                });

                pageItem.append(pageLink);
                pagination.append(pageItem);
            }
        }

        $('#searchForm').on('submit', function(e) {
            e.preventDefault();
            const query = $('#searchQuery').val();
            loadArticles(0, query);
        });

        $('.list-group-item').on('click', function(e) {
            e.preventDefault();
            const category = $(this).data('category');
            loadArticles(0, category);
        });

        $(document).ready(function() {
            loadArticles(0);
        });
    </script>

</div>
</body>
</html>
